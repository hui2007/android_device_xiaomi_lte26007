name: Build TWRP for lte26007 (Full Source - Fixed Manifest)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-twrp:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 全源码同步耗时较长，延长超时

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: android_device_xiaomi_lte26007
          fetch-depth: 1

      # 缓存全源码（约20GB，首次慢，后续复用）
      - name: Cache TWRP Full Source Code
        uses: actions/cache@v4
        id: cache-twrp-full
        with:
          path: ~/twrp-11-full
          key: twrp-11-full-source-fixed-${{ github.sha }}
          restore-keys: |
            twrp-11-full-source-fixed-

      # 安装32位依赖
      - name: Fix 32-bit Dependencies for Ubuntu 22.04
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update -y
          sudo apt install -y --fix-broken
          sudo apt install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses-dev lib32readline8 lib32z1-dev \
            liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev:i386 \
            openjdk-8-jdk
          sudo ln -s /usr/lib32/libncurses.so /usr/lib32/libncurses.so.5
          sudo ln -s /usr/lib32/libreadline.so /usr/lib32/libreadline.so.6

      # 安装Repo工具
      - name: Install Repo Tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/bin/
          export REPO_PYTHON=/usr/bin/python3
          echo "REPO_PYTHON=/usr/bin/python3" >> $GITHUB_ENV

      # 同步TWRP 11全源码（修正后的官方地址）
      - name: Sync TWRP 11 Full Source Tree (Fixed Manifest)
        if: steps.cache-twrp-full.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/twrp-11-full
          cd ~/twrp-11-full
          # ===================== 修正的核心：正确的manifest地址 =====================
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 --depth=1
          # ==========================================================================
          # 单线程+重试，避免网络限流/超时
          repo sync -j1 --retry-fetches=5 --force-sync --no-clone-bundle --no-tags --quiet

      # 链接并验证设备树
      - name: Link and Verify Device Tree
        run: |
          cd ~/twrp-11-full
          mkdir -p device/xiaomi
          cp -r $GITHUB_WORKSPACE/android_device_xiaomi_lte26007 device/xiaomi/lte26007
          # 检查设备树关键文件
          if [ ! -f device/xiaomi/lte26007/omni_lte26007.mk ]; then
            echo "Error: omni_lte26007.mk not found!"
            exit 1
          fi
          # 全源码已包含Omni vendor，验证是否存在
          if [ ! -f vendor/omni/config/common.mk ]; then
            echo "Omni vendor missing, syncing separately..."
            cd ~/twrp-11-full
            repo sync -j1 vendor/omni --force-sync
          fi

      # 编译TWRP（原生兼容Soong，直接用mka）
      - name: Build TWRP Recovery Image
        run: |
          cd ~/twrp-11-full
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export TARGET_ARCH=arm
          export TARGET_CPU_ABI=armeabi-v7a
          export USE_NSJAIL=false
          lunch omni_lte26007-eng
          mka -j2 recoveryimage

      # 上传编译产物
      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-lte26007-FullSource-Fixed
          path: ~/twrp-11-full/out/target/product/lte26007/recovery.img
          retention-days: 30
