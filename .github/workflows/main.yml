name: Build TWRP for lte26007 (ubuntu-latest)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-twrp:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: android_device_xiaomi_lte26007
          fetch-depth: 1

      - name: Fix 32-bit Dependencies for Ubuntu 22.04
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update -y
          sudo apt install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses-dev lib32readline8 lib32z1-dev \
            liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev:i386 \
            openjdk-8-jdk
          # 创建软链接兼容旧版编译脚本
          sudo ln -s /usr/lib32/libncurses.so /usr/lib32/libncurses.so.5
          sudo ln -s /usr/lib32/libreadline.so /usr/lib32/libreadline.so.6

      - name: Sync TWRP 11 Source Code
        run: |
          mkdir -p ~/twrp-11
          cd ~/twrp-11
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest.git -b twrp-11 --depth=1
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Link Device Tree to Source
        run: |
          cd ~/twrp-11
          mkdir -p device/xiaomi
          ln -s $GITHUB_WORKSPACE/android_device_xiaomi_lte26007 device/xiaomi/lte26007

      - name: Build TWRP Recovery Image
        run: |
          cd ~/twrp-11
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export TARGET_ARCH=arm
          export TARGET_CPU_ABI=armeabi-v7a
          lunch omni_lte26007-eng
          mka -j$(nproc --all) recoveryimage

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-lte26007-arm-ubuntu-latest
          path: ~/twrp-11/out/target/product/lte26007/recovery.img
          retention-days: 30
