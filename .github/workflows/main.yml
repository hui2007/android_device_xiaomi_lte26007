name: Build TWRP for lte26007

on:
  push:
    branches: [ main ]  # 触发分支，可根据你的实际分支修改
  pull_request:
    branches: [ main ]
  workflow_dispatch:      # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: android_device_xiaomi_lte26007

      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-8-jdk

      - name: Sync TWRP source
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest.git -b twrp-11
          repo sync -j$(nproc) --force-sync

      - name: Link device tree
        run: |
          cd ~/twrp
          mkdir -p device/xiaomi
          ln -s $GITHUB_WORKSPACE/android_device_xiaomi_lte26007 device/xiaomi/lte26007

      - name: Build TWRP
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_lte26007-eng
          mka recoveryimage

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-recovery
          path: ~/twrp/out/target/product/lte26007/recovery.img
