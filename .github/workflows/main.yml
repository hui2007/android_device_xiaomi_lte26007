name: Build TWRP for lte26007 (Force Cache Full Source)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-twrp:
    # 依赖Job1完成
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: android_device_xiaomi_lte26007
          fetch-depth: 1

      # 恢复Job1存储的源码缓存
      - name: Restore TWRP Full Source Cache
        uses: actions/cache@v4
        with:
          path: ~/twrp-11-full
          key: twrp-11-full-source-force-f2e6a160317bcb1c1931bb06b50809ccb33fb6f7
          restore-keys: |
            twrp-11-full-source-force-

      # 安装完整编译依赖
      - name: Install Full Build Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update -y
          sudo apt install -y --fix-broken
          # 安装所有编译必需依赖
          sudo apt install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses-dev lib32readline8 lib32z1-dev \
            liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev:i386 \
            openjdk-8-jdk
          # 修复32位库软链接
          sudo ln -sf /usr/lib32/libncurses.so /usr/lib32/libncurses.so.5 || true
          sudo ln -sf /usr/lib32/libreadline.so /usr/lib32/libreadline.so.6 || true

      # 链接设备树并编译TWRP
      - name: Link Device Tree and Build TWRP
        run: |
          cd ~/twrp-11-full
          # 复制设备树到源码目录
          mkdir -p device/xiaomi
          cp -r $GITHUB_WORKSPACE/android_device_xiaomi_lte26007 device/xiaomi/lte26007
          # 编译配置
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true  # 允许缺失依赖继续编译
          export TARGET_ARCH=arm
          export TARGET_CPU_ABI=armeabi-v7a
          export USE_NSJAIL=false
          # 执行编译
          lunch omni_lte26007-eng
          mka -j2 recoveryimage

      # 仅编译成功时上传产物
      - name: Upload Recovery Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-lte26007-FullSource-Cached
          path: ~/twrp-11-full/out/target/product/lte26007/recovery.img
          retention-days: 30
