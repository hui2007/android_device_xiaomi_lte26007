# 给 workflow 命名，方便在 Actions 面板识别
name: Build TWRP Recovery

# 触发条件：手动触发 + 推送到 main 分支时触发（可根据需求修改）
on:
  workflow_dispatch:  # 手动触发（推荐，方便调试

# 定义执行的任务
jobs:
  build-twrp:
    # 运行环境：选择 Ubuntu 最新版（TWRP 编译需要 Linux 环境）
    runs-on: ubuntu-latest
    
    steps:
      # 第一步：检出代码（GitHub Actions 必备步骤，获取仓库文件）
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # 第二步：运行 TWRP 编译 Action（修复后的核心配置）
      - name: TWRP Build Action
        uses: mlm-games/TWRP-recovery-build-action@v1.1
        with:
          # TWRP 清单分支（使用默认的 twrp-12.1，可根据需求修改）
          MANIFEST_BRANCH: twrp-12.1
          
          # 设备树仓库地址（必填：替换为你的设备树 GitHub 地址，如 https://github.com/你的用户名/设备树仓库名）
          DEVICE_TREE: https://github.com/hui2007/android_device_xiaomi_lte26007  # 或手动写死：https://github.com/xxx/xxx-device-tree
          
          # 设备树分支（可选：不写则用仓库默认分支，如需指定则赋值，如 main）
          DEVICE_TREE_BRANCH: full_lte26007-user-4.4.4-KTU84Q-V6.6.5.0.KHLCNCF-release-keys
        
